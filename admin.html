<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Správa produktů — Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Admin Layout ── */
    body { background: #f0ebe1; }

    .admin-wrap {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .admin-sidebar {
      background: var(--text);
      padding: 1.5rem 0;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .admin-sidebar .logo {
      padding: 0 1.5rem 1.5rem;
      color: var(--sand);
      border-bottom: 1px solid rgba(255,255,255,.08);
      margin-bottom: 1rem;
    }
    .admin-sidebar .logo span { color: var(--gold-light); }

    .admin-nav a {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1.5rem;
      font-size: .82rem;
      font-weight: 500;
      color: rgba(232,220,200,.6);
      transition: all var(--transition);
    }
    .admin-nav a:hover,
    .admin-nav a.active {
      background: rgba(184,151,90,.12);
      color: var(--gold-light);
      border-left: 2px solid var(--gold);
    }
    .admin-nav a .nav-icon { font-size: 1rem; }

    .admin-sidebar-footer {
      margin-top: auto;
      padding: 1.5rem;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .admin-sidebar-footer a {
      font-size: .8rem;
      color: rgba(232,220,200,.4);
      transition: color var(--transition);
    }
    .admin-sidebar-footer a:hover { color: var(--sand); }

    /* ── Main ── */
    .admin-main { padding: 2rem; overflow-x: hidden; }

    .admin-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .admin-topbar h2 { margin-bottom: .2rem; }
    .admin-topbar p { font-size: .82rem; color: var(--text-light); }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-card__label {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: .5rem;
    }
    .stat-card__value {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--text);
      line-height: 1;
    }
    .stat-card__sub {
      font-size: .75rem;
      color: var(--sage);
      margin-top: .3rem;
    }

    /* ── Products Table ── */
    .admin-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .admin-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .admin-card__header h3 { font-family: var(--font-serif); }

    .products-table { width: 100%; border-collapse: collapse; }
    .products-table th {
      text-align: left;
      padding: .75rem 1rem;
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-light);
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }
    .products-table td {
      padding: .875rem 1rem;
      font-size: .85rem;
      color: var(--text-mid);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .products-table tr:last-child td { border-bottom: none; }
    .products-table tr:hover td { background: rgba(245,240,232,.5); }

    .table-thumb {
      width: 44px; height: 44px;
      border-radius: var(--radius);
      object-fit: cover;
      background: var(--sand);
    }

    .table-name { font-weight: 500; color: var(--text); }
    .table-price { font-weight: 500; color: var(--gold-dark); }

    .badge-stock {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .7rem;
      font-weight: 500;
      padding: .25rem .65rem;
      border-radius: 2rem;
    }
    .badge-stock--in  { background: rgba(122,140,110,.12); color: var(--sage); }
    .badge-stock--out { background: rgba(192,57,43,.08);  color: #c0392b; }
    .badge-stock::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .table-actions { display: flex; gap: .5rem; }
    .action-btn {
      padding: .35rem .75rem;
      border-radius: var(--radius);
      font-size: .72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-mid);
    }
    .action-btn:hover { border-color: var(--gold); color: var(--gold); }
    .action-btn--danger:hover { border-color: #c0392b; color: #c0392b; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44,36,24,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 1rem;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-family: var(--font-serif); }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-light);
      font-size: 1.1rem;
      transition: background var(--transition);
      cursor: pointer;
    }
    .modal-close:hover { background: var(--sand); }

    .modal-body { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: .75rem;
    }

    @media (max-width: 900px) {
      .admin-wrap { grid-template-columns: 1fr; }
      .admin-sidebar { display: none; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a href="index.html" class="logo">Korálky <span>&amp; Šperky</span></a>
      <nav class="admin-nav">
        <a href="#" class="active">
          <span class="nav-icon">💎</span> Produkty
        </a>
        <a href="index.html" target="_blank">
          <span class="nav-icon">🛍️</span> Zobrazit obchod
        </a>
        <a href="cart.html">
          <span class="nav-icon">🛒</span> Košík
        </a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="index.html">← Zpět na web</a>
      </div>
    </aside>

    <!-- Main -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h2>Správa produktů</h2>
          <p>Přidávej, upravuj a mazej produkty v kolekci.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal()">
          + Přidat produkt
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-card__label">Celkem produktů</div>
          <div class="stat-card__value" id="stat-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Skladem</div>
          <div class="stat-card__value" id="stat-instock">—</div>
          <div class="stat-card__sub">dostupných</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Kategorií</div>
          <div class="stat-card__value" id="stat-cats">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Průměrná cena</div>
          <div class="stat-card__value" id="stat-avg">—</div>
          <div class="stat-card__sub">Kč</div>
        </div>
      </div>

      <!-- Table -->
      <div class="admin-card">
        <div class="admin-card__header">
          <h3>Produkty</h3>
          <span id="product-count" style="font-size:.8rem;color:var(--text-light)"></span>
        </div>
        <div style="overflow-x:auto">
          <table class="products-table" id="products-table">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Název</th>
                <th>Kategorie</th>
                <th>Cena</th>
                <th>Sklad</th>
                <th>Akce</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-light)">
                Načítám produkty…
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Add / Edit Product -->
  <div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalOnBg(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Nový produkt</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Název *</label>
            <input class="form-input" id="f-name" type="text" required>
          </div>
          <div class="form-group">
            <label class="form-label">Cena (Kč) *</label>
            <input class="form-input" id="f-price" type="number" min="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Kategorie</label>
            <select class="form-select" id="f-category">
              <option>Náramky</option>
              <option>Náhrdelníky</option>
              <option>Náušnice</option>
              <option>Sady</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Badge (volitelný)</label>
            <input class="form-input" id="f-badge" type="text" placeholder="Novinka, Bestseller…">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Popis</label>
          <textarea class="form-textarea" id="f-desc"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Materiál</label>
          <input class="form-input" id="f-material" type="text">
        </div>
        <div class="form-group">
          <label class="form-label">URL fotky (hlavní)</label>
          <input class="form-input" id="f-image" type="url" placeholder="https://…">
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;cursor:pointer">
            <input type="checkbox" id="f-instock" checked style="accent-color:var(--gold)">
            Produkt je skladem
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">Zrušit</button>
        <button class="btn btn-primary" onclick="saveProduct()">Uložit produkt</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    /*
     * POZNÁMKA: Admin upravuje produkty pouze v localStorage pro demonstraci.
     * Pro produkci by se změny ukládaly na server / do CMS.
     * products.json je zdrojový soubor — změny zde se neprojeví po reloadu
     * pokud nejsou uloženy do souboru.
     */

    const ADMIN_KEY = 'koralky_admin_products';
    let adminProducts = [];
    let editingId = null;

    async function initAdmin() {
      /* Načti z localStorage (admin úpravy), nebo z products.json */
      const stored = localStorage.getItem(ADMIN_KEY);
      if (stored) {
        adminProducts = JSON.parse(stored);
      } else {
        adminProducts = await loadProducts();
      }
      renderTable();
      renderStats();
    }

    function saveAdminProducts() {
      localStorage.setItem(ADMIN_KEY, JSON.stringify(adminProducts));
    }

    /* ── Stats ── */
    function renderStats() {
      const total   = adminProducts.length;
      const instock = adminProducts.filter(p => p.inStock !== false).length;
      const cats    = [...new Set(adminProducts.map(p => p.category).filter(Boolean))].length;
      const avg     = total
        ? Math.round(adminProducts.reduce((s, p) => s + p.price, 0) / total)
        : 0;

      document.getElementById('stat-total').textContent   = total;
      document.getElementById('stat-instock').textContent = instock;
      document.getElementById('stat-cats').textContent    = cats;
      document.getElementById('stat-avg').textContent     = avg.toLocaleString('cs-CZ');
      document.getElementById('product-count').textContent = `${total} produktů`;
    }

    /* ── Table ── */
    function renderTable() {
      const tbody = document.getElementById('table-body');
      if (!adminProducts.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-light)">
          Žádné produkty. Přidej první!
        </td></tr>`;
        return;
      }

      tbody.innerHTML = adminProducts.map(p => {
        const img   = p.images?.[0] || p.image || '';
        const stock = p.inStock !== false
          ? `<span class="badge-stock badge-stock--in">Skladem</span>`
          : `<span class="badge-stock badge-stock--out">Vyprodáno</span>`;

        return `
          <tr>
            <td>
              ${img
                ? `<img class="table-thumb" src="${img}" alt="${p.name}">`
                : `<div class="table-thumb" style="background:var(--sand);border-radius:4px"></div>`
              }
            </td>
            <td>
              <span class="table-name">${p.name}</span>
              ${p.badge ? `<br><span style="font-size:.68rem;color:var(--gold)">${p.badge}</span>` : ''}
            </td>
            <td>${p.category || '—'}</td>
            <td class="table-price">${formatPrice(p.price)}</td>
            <td>${stock}</td>
            <td>
              <div class="table-actions">
                <button class="action-btn" onclick="editProduct(${p.id})">Upravit</button>
                <button class="action-btn" onclick="toggleStock(${p.id})">
                  ${p.inStock !== false ? 'Vyprodej' : 'Naskladni'}
                </button>
                <button class="action-btn action-btn--danger"
                        onclick="deleteProduct(${p.id})">Smazat</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    /* ── Modal ── */
    function openModal(id = null) {
      editingId = id;
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.remove('hidden');
      document.getElementById('modal-title').textContent =
        id ? 'Upravit produkt' : 'Nový produkt';

      if (id) {
        const p = adminProducts.find(x => x.id === id);
        if (p) {
          document.getElementById('f-name').value     = p.name;
          document.getElementById('f-price').value    = p.price;
          document.getElementById('f-category').value = p.category || 'Náramky';
          document.getElementById('f-badge').value    = p.badge || '';
          document.getElementById('f-desc').value     = p.description || '';
          document.getElementById('f-material').value = p.material || '';
          document.getElementById('f-image').value    = p.images?.[0] || p.image || '';
          document.getElementById('f-instock').checked = p.inStock !== false;
        }
      } else {
        document.getElementById('f-name').value     = '';
        document.getElementById('f-price').value    = '';
        document.getElementById('f-badge').value    = '';
        document.getElementById('f-desc').value     = '';
        document.getElementById('f-material').value = '';
        document.getElementById('f-image').value    = '';
        document.getElementById('f-instock').checked = true;
        document.getElementById('f-category').value = 'Náramky';
      }
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      editingId = null;
    }

    function closeModalOnBg(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    function editProduct(id) { openModal(id); }

    function saveProduct() {
      const name  = document.getElementById('f-name').value.trim();
      const price = Number(document.getElementById('f-price').value);
      if (!name || !price) {
        showToast('Vyplň název a cenu', 'error');
        return;
      }

      const data = {
        name,
        price,
        category:    document.getElementById('f-category').value,
        badge:       document.getElementById('f-badge').value.trim() || null,
        description: document.getElementById('f-desc').value.trim(),
        material:    document.getElementById('f-material').value.trim(),
        images:      [document.getElementById('f-image').value.trim()].filter(Boolean),
        inStock:     document.getElementById('f-instock').checked,
      };

      if (editingId) {
        const idx = adminProducts.findIndex(p => p.id === editingId);
        if (idx !== -1) adminProducts[idx] = { ...adminProducts[idx], ...data };
        showToast('Produkt upraven ✓', 'success');
      } else {
        const newId = Math.max(0, ...adminProducts.map(p => p.id)) + 1;
        adminProducts.push({ id: newId, ...data });
        showToast('Produkt přidán ✓', 'success');
      }

      saveAdminProducts();
      renderTable();
      renderStats();
      closeModal();
    }

    function deleteProduct(id) {
      if (!confirm('Opravdu smazat tento produkt?')) return;
      adminProducts = adminProducts.filter(p => p.id !== id);
      saveAdminProducts();
      renderTable();
      renderStats();
      showToast('Produkt smazán');
    }

    function toggleStock(id) {
      const p = adminProducts.find(x => x.id === id);
      if (p) {
        p.inStock = p.inStock === false;
        saveAdminProducts();
        renderTable();
        showToast(p.inStock ? 'Naskladněno ✓' : 'Označeno jako vyprodáno');
      }
    }

    document.addEventListener('DOMContentLoaded', initAdmin);
  </script>
</body>
</html>
