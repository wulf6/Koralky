<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stránka nenalezena — Korálky & Šperky</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    .page-404 {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .page-404__inner { max-width: 480px; }
    .page-404__num {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 20vw, 10rem);
      line-height: 1;
      color: var(--sand-dark);
      margin-bottom: 1rem;
      display: block;
    }
    .page-404__icon {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    .page-404 h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 1rem;
    }
    .page-404 p {
      margin-bottom: 2rem;
      font-size: .95rem;
    }
    .page-404__actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-404">
      <div class="page-404__inner">
        <span class="page-404__icon">✦</span>
        <span class="page-404__num">404</span>
        <h1>Stránka nenalezena</h1>
        <p>Hledaná stránka neexistuje nebo byla přesunuta.<br>
           Zkuste se vrátit na úvodní stránku.</p>
        <div class="page-404__actions">
          <a href="index.html" class="btn btn-primary btn-lg">← Zpět na úvod</a>
          <a href="index.html#kolekce" class="btn btn-outline btn-lg">Prohlédnout kolekci</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
